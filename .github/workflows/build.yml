name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify signing secrets
        if: github.event_name != 'pull_request'
        env:
          ICU_KEYSTORE_B64: ${{ secrets.ICU_KEYSTORE_B64 }}
          ICU_KEYSTORE_PASSWORD: ${{ secrets.ICU_KEYSTORE_PASSWORD }}
          ICU_KEY_ALIAS: ${{ secrets.ICU_KEY_ALIAS }}
          ICU_KEY_PASSWORD: ${{ secrets.ICU_KEY_PASSWORD }}
        run: |
          test -n "$ICU_KEYSTORE_B64" || { echo '::error::ICU_KEYSTORE_B64 is missing'; exit 1; }
          test -n "$ICU_KEYSTORE_PASSWORD" || { echo '::error::ICU_KEYSTORE_PASSWORD is missing'; exit 1; }
          test -n "$ICU_KEY_ALIAS" || { echo '::error::ICU_KEY_ALIAS is missing'; exit 1; }
          test -n "$ICU_KEY_PASSWORD" || { echo '::error::ICU_KEY_PASSWORD is missing'; exit 1; }

      - name: Decode persistent signing key
        if: github.event_name != 'pull_request'
        env:
          ICU_KEYSTORE_B64: ${{ secrets.ICU_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ICU_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/icaughtu-release.p12"
          chmod 600 "$RUNNER_TEMP/icaughtu-release.p12"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ICU_KEYSTORE_PATH: ${{ runner.temp }}/icaughtu-release.p12
          ICU_KEYSTORE_PASSWORD: ${{ secrets.ICU_KEYSTORE_PASSWORD }}
          ICU_KEY_ALIAS: ${{ secrets.ICU_KEY_ALIAS }}
          ICU_KEY_PASSWORD: ${{ secrets.ICU_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Build pull-request debug APK
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: icaughtu-android-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload pull-request debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: icaughtu-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
